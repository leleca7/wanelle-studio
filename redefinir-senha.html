<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Redefinir senha — Wanelle Studio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff3e6,#f8e0e5);font:16px system-ui;color:#422a2d}.box{max-width:450px;width:calc(100% - 30px);border-radius:24px;background:#fffaf5;box-shadow:0 18px 50px #5d173525;padding:32px}.logo{font:italic 44px Georgia,serif;color:#9d2049}h1{color:#7e1736;font:32px Georgia,serif}label{font-weight:700;display:block;margin:18px 0 6px}input{width:100%;padding:14px;border:1px solid #e2c3cc;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:24px;background:#ad244c;color:white;padding:14px;cursor:pointer;font-weight:800;margin:18px 0}a{color:#891b40}p{line-height:1.55}.info{font-size:14px;color:#765b62}</style></head><body><main class="box"><div class="logo"><img src="/assets/media/foto-d1a021079f73c4.png" alt="Wanelle Tortas" width="188" style="display:block;width:188px;max-width:100%;height:auto"></div><h1>Crie sua nova senha</h1><p class="info">Seu link é pessoal e pode ser utilizado apenas uma vez. Confira a validade no e-mail recebido.</p><form id="reset"><label for="pw">Nova senha (mínimo 14 caracteres)</label><input id="pw" type="password" required minlength="14" maxlength="128" autocomplete="new-password"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" required minlength="14" maxlength="128" autocomplete="new-password"><button type="submit">Salvar nova senha ↗</button></form><p id="feedback" role="status"></p><a href="/admin.html">Voltar ao login</a></main><script>const form=document.getElementById('reset'),feedback=document.getElementById('feedback');const token=new URLSearchParams(location.search).get('token')||'';history.replaceState({},'',location.pathname);if(!/^[a-f0-9]{64}$/.test(token)){feedback.textContent='Link inválido. Solicite outro na tela de login.';form.hidden=true;}form.addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(pw!==document.getElementById('confirm').value){feedback.textContent='As senhas não coincidem.';return}const button=form.querySelector('button');button.disabled=true;feedback.textContent='Salvando...';try{const res=await fetch('/api/wanelle?action=reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});const data=await res.json();if(!res.ok)throw Error(data.error||'Não foi possível alterar a senha.');feedback.textContent='Senha alterada. Você já pode entrar no painel com a nova senha.';form.hidden=true;history.replaceState({},'',location.pathname);}catch(err){feedback.textContent=err.message}finally{button.disabled=false}});</script></body></html>
